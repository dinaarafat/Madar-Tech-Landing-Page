<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#03213D">
    <title>إدارة محتوى الموقع | مدار تك</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="../index.html" aria-label="مدار تك - الموقع">
                <img src="../assets/images/Artboard%201.png" alt="">
                <span><strong>مدار تك</strong><small>إدارة الموقع</small></span>
            </a>
            <p class="sidebar-label">إدارة المحتوى</p>
            <nav class="dashboard-nav" aria-label="أقسام لوحة التحكم">
                <button class="nav-item is-active" type="button" data-page="overview"><span aria-hidden="true">⌂</span>نظرة عامة</button>
                <button class="nav-item" type="button" data-page="content"><span aria-hidden="true">▤</span>محتوى الصفحة</button>
                <button class="nav-item" type="button" data-page="hero"><span aria-hidden="true">▧</span>عارض الصور</button>
                <button class="nav-item" type="button" data-page="sections"><span aria-hidden="true">☷</span>إدارة الأقسام</button>
                <button class="nav-item" type="button" data-page="media"><span aria-hidden="true">▧</span>الوسائط</button>
                <button class="nav-item" type="button" data-page="appearance"><span aria-hidden="true">◉</span>المظهر</button>
                <button class="nav-item" type="button" data-page="settings"><span aria-hidden="true">⚙</span>الإعدادات</button>
            </nav>
            <a class="site-link" href="../index.html" target="_blank" rel="noopener">فتح الموقع <span aria-hidden="true">↗</span></a>
        </aside>

        <div class="dashboard-workspace">
            <header class="topbar">
                <div>
                    <span class="breadcrumb">مدار تك <span aria-hidden="true">/</span> إدارة الموقع</span>
                    <h1 id="page-title">نظرة عامة</h1>
                </div>
                <div class="topbar-actions">
                    <label class="language-control" for="content-language">
                        <span>لغة المحتوى</span>
                        <select id="content-language" aria-label="لغة المحتوى">
                            <option value="ar">العربية</option>
                            <option value="en">English</option>
                        </select>
                    </label>
                    <span class="save-state" id="save-state" role="status">جارٍ تحميل المحتوى...</span>
                    <button class="button button-quiet" id="preview-button" type="button">معاينة</button>
                    <button class="button button-primary" id="publish-button" type="button" disabled>نشر التغييرات</button>
                </div>
            </header>
            <main id="cms-view" class="cms-view" tabindex="-1">
                <div class="loading-state" role="status">جارٍ تحميل محتوى الموقع...</div>
            </main>
        </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/script.js"></script>
</body>
</html>
